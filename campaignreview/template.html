<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Affinity Group video presentation and resources."
  >

  <title>Affinity Video Player</title>

  <!-- Update this path if the page is inside another folder -->
  <link rel="stylesheet" href="../css/campaignreview-style.css">
</head>

<body>

  <!-- HEADER -->
<header>
  <div class="container">

    <div class="logo-container">

      <!-- AFFINITY GROUP LOGO -->
      <img
        src="images/AG Horizontal Primary.png"
        alt="Affinity Group"
        class="logo affinity-logo"
      >

      <!-- CLIENT LOGO -->
      <img
        src="images/client-logo.png"
        alt="Client company"
        class="logo client-logo"
      >

    </div>

  </div>
</header>


  <!-- MAIN CONTENT -->
  <main class="content">
    <div class="container">

      <article class="video-container">

        <!-- VIDEO -->
        <div class="video-wrapper">

          <iframe
            src="https://player.vimeo.com/video/VIDEO-ID?h=VIDEO-CODE"
            title="Video title"
            allow="autoplay; fullscreen; picture-in-picture"
            allowfullscreen>
          </iframe>

        </div>


        <!-- VIDEO INFORMATION -->
        <div class="video-info">

          <h1 class="video-title">
            Page or Account Name
          </h1>

          <p class="video-address">
            Address, City, Province or State
          </p>


          <!--
            OPTIONAL PROMOTIONAL MESSAGE

            Remove the comment tags when this section is needed.

          <p class="promo-text">
            Add a promotional message or callout here.
          </p>
          -->


          <!--
            OPTIONAL SUPPORTING MESSAGE

            Remove the comment tags when this section is needed.

          <p class="video-address">
            Contact your Affinity Group sales representative for assistance.
          </p>
          -->


          <!-- BUTTONS -->
          <div class="button-row">

            <a
              href="https://example.com"
              class="request-button"
              target="_blank"
              rel="noopener noreferrer">
              Primary Action
            </a>

            <!--
              OPTIONAL ADDITIONAL BUTTON

              Copy this entire link for each additional button.

            <a
              href="https://example.com"
              class="request-button"
              target="_blank"
              rel="noopener noreferrer">
              Secondary Action
            </a>
            -->

          </div>

        </div>


        <!--
          OPTIONAL IMAGE OR MAP

          Remove the comment tags and update the image details
          when this section is needed.

        <div class="map-image">

          <img
            src="images/promotional-image.png"
            alt="Description of promotional image"
          >

        </div>
        -->

      </article>

    </div>
  </main>

</body>
</html>
